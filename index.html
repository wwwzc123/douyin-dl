<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抖音无水印下载</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0d0d0d; color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh; display: flex; justify-content: center;
  align-items: center; padding: 20px;
}
.container { width: 100%; max-width: 540px; }
h1 {
  text-align: center; font-size: 24px; margin-bottom: 8px;
  background: linear-gradient(135deg, #fe2c55, #25f4ee);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.subtitle { text-align: center; color: #666; font-size: 13px; margin-bottom: 24px; }
.input-wrap { display: flex; gap: 10px; margin-bottom: 16px; }
#urlInput {
  flex: 1; padding: 14px 18px; border: 2px solid #222;
  border-radius: 12px; background: #111; color: #fff; font-size: 14px;
  outline: none; transition: border-color 0.3s;
}
#urlInput:focus { border-color: #fe2c55; }
#urlInput::placeholder { color: #444; }
.btn {
  padding: 14px 24px; border: none; border-radius: 12px;
  color: #fff; font-size: 14px; font-weight: bold; cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
  white-space: nowrap;
}
.btn:hover { opacity: 0.9; transform: translateY(-1px); }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn-primary { background: linear-gradient(135deg, #fe2c55, #ff0050); }
.btn-success { background: #00c853; color: #000; }
.btn-outline { background: #222; border: 1px solid #444; }

.result { display: none; }
.result.show { display: block; }

.info-card {
  background: #111; border: 1px solid #222; border-radius: 16px;
  padding: 20px; margin-top: 12px;
}
.desc {
  color: #ccc; font-size: 14px; margin-bottom: 10px;
  line-height: 1.6; word-break: break-all;
}
.actions { display: flex; flex-direction: column; gap: 8px; }
.sites-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.site-btn { font-size: 12px !important; padding: 10px 6px !important; text-align: center; text-decoration: none; }

.cookie-section {
  background: #1a1a0a; border: 1px solid #333; border-radius: 12px;
  padding: 14px; margin-top: 12px; display: none;
}
.cookie-section.show { display: block; }
.cookie-section p { color: #999; font-size: 12px; margin-bottom: 8px; }
.cookie-section textarea {
  width: 100%; height: 80px; background: #000; color: #0f0;
  border: 1px solid #333; border-radius: 8px; padding: 8px;
  font-size: 11px; font-family: monospace; resize: vertical;
}
.cookie-section .btn { margin-top: 8px; width: 100%; }

.error {
  display: none; padding: 16px 20px; background: #1a0000;
  border: 1px solid #fe2c55; border-radius: 12px; color: #fe2c55;
  font-size: 14px; margin-top: 12px; white-space: pre-wrap;
}
.error.show { display: block; }
.loading { display: none; text-align: center; padding: 30px; color: #666; font-size: 14px; }
.loading.show { display: block; }
.spinner {
  display: inline-block; width: 24px; height: 24px; border: 2px solid #333;
  border-top-color: #fe2c55; border-radius: 50%; animation: spin 0.8s linear infinite;
  margin-right: 10px; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="container">
  <h1>抖音无水印下载</h1>
  <p class="subtitle">粘贴分享链接，直接下载到电脑</p>

  <div class="input-wrap">
    <input type="text" id="urlInput" placeholder="粘贴抖音分享链接...">
    <button class="btn btn-primary" id="parseBtn" onclick="doParse()">解析</button>
  </div>

  <div class="loading" id="loading"><span class="spinner"></span>解析中...</div>
  <div class="error" id="error"></div>

  <div class="result" id="result">
    <div class="info-card">
      <div class="desc" id="resultDesc"></div>
      <div class="actions">
        <button class="btn btn-success" id="directDlBtn" onclick="doDirectDownload()">直接下载</button>
        <p style="font-size:11px;color:#555;margin:8px 0 4px;">或跳转到以下网站下载：</p>
        <div class="sites-grid" id="webSites"></div>
      </div>
    </div>
  </div>

  <div class="cookie-section" id="cookieSection">
    <p>需要 cookies 才能下载。用浏览器扩展导出 cookies 后粘贴到下面：</p>
    <textarea id="cookieInput" placeholder="粘贴 Netscape 格式的 cookies..."></textarea>
    <button class="btn btn-primary" onclick="saveCookies()">保存 Cookies 并重试</button>
  </div>
</div>

<script>
let currentDownloadUrl = '';
let downloadSites = [];

async function doParse() {
  const input = document.getElementById('urlInput').value.trim();
  if (!input) return;

  const btn = document.getElementById('parseBtn');
  const err = document.getElementById('error');
  const res = document.getElementById('result');
  const load = document.getElementById('loading');
  const cookieSec = document.getElementById('cookieSection');

  res.classList.remove('show');
  err.classList.remove('show');
  cookieSec.classList.remove('show');
  load.classList.add('show');
  btn.disabled = true;

  try {
    const r = await fetch(`/api/parse?url=${encodeURIComponent(input)}`);
    const d = await r.json();
    if (d.error) throw new Error(d.error);

    document.getElementById('resultDesc').textContent = d.desc || '';
    currentDownloadUrl = d.downloadDirect || '';
    downloadSites = d.downloadSites || [];

    // 渲染在线网站按钮
    const sitesContainer = document.getElementById('webSites');
    sitesContainer.innerHTML = '';
    downloadSites.forEach(site => {
      const a = document.createElement('a');
      a.className = 'btn btn-outline site-btn';
      a.textContent = site.name;
      a.href = site.url;
      a.target = '_blank';
      a.rel = 'noopener';
      sitesContainer.appendChild(a);
    });

    res.classList.add('show');
  } catch (e) {
    err.textContent = '错误: ' + e.message;
    err.classList.add('show');
  } finally {
    load.classList.remove('show');
    btn.disabled = false;
  }
}

async function doDirectDownload() {
  if (!currentDownloadUrl) return;
  const err = document.getElementById('error');
  const cookieSec = document.getElementById('cookieSection');
  err.classList.remove('show');

  try {
    const r = await fetch(currentDownloadUrl);
    if (r.status === 403) {
      const d = await r.json();
      if (d.needCookies) {
        err.textContent = d.guide || '需要 Cookies';
        err.classList.add('show');
        cookieSec.classList.add('show');
        return;
      }
      throw new Error(d.error || '下载失败');
    }
    if (!r.ok) throw new Error('下载失败: ' + r.status);

    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const cd = r.headers.get('Content-Disposition') || '';
    const m = cd.match(/filename="?([^"]+)"?/);
    a.download = m ? decodeURIComponent(m[1]) : 'douyin.mp4';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
  } catch (e) {
    err.textContent = '下载失败: ' + e.message;
    err.classList.add('show');
  }
}

async function saveCookies() {
  const cookies = document.getElementById('cookieInput').value.trim();
  if (!cookies) return;

  try {
    const r = await fetch('/api/cookies', { method: 'POST', body: cookies });
    const d = await r.json();
    if (d.ok) {
      document.getElementById('cookieSection').classList.remove('show');
      document.getElementById('error').classList.remove('show');
      doDirectDownload();
    }
  } catch (e) {
    document.getElementById('error').textContent = '保存失败: ' + e.message;
    document.getElementById('error').classList.add('show');
  }
}

document.getElementById('urlInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doParse();
});

window.addEventListener('focus', async () => {
  try {
    const t = await navigator.clipboard.readText();
    if (t && /douyin\.com|v\.douyin/.test(t)) {
      document.getElementById('urlInput').value = t;
    }
  } catch (e) {}
});
</script>
</body>
</html>
