<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抖音无水印下载</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0d0d0d;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.container { width: 100%; max-width: 520px; }
h1 {
  text-align: center; font-size: 24px; margin-bottom: 8px;
  background: linear-gradient(135deg, #fe2c55, #25f4ee);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.subtitle { text-align: center; color: #666; font-size: 13px; margin-bottom: 28px; }
.input-wrap { display: flex; gap: 10px; margin-bottom: 20px; }
#urlInput {
  flex: 1; padding: 14px 18px; border: 2px solid #222;
  border-radius: 12px; background: #111; color: #fff; font-size: 14px;
  outline: none; transition: border-color 0.3s;
}
#urlInput:focus { border-color: #fe2c55; }
#urlInput::placeholder { color: #444; }
#downloadBtn {
  padding: 14px 28px; border: none; border-radius: 12px;
  background: linear-gradient(135deg, #fe2c55, #ff0050);
  color: #fff; font-size: 14px; font-weight: bold; cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s; white-space: nowrap;
}
#downloadBtn:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(254,44,85,0.4); }
#downloadBtn:active { transform: scale(0.97); }
#downloadBtn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
.result { display: none; }
.result.show { display: block; }
.info-card {
  background: #111; border: 1px solid #222; border-radius: 16px;
  padding: 20px; margin-top: 12px;
}
.desc {
  color: #ccc; font-size: 14px; margin-bottom: 16px;
  line-height: 1.6; word-break: break-all;
}
.dl-options { display: flex; flex-direction: column; gap: 10px; }
.dl-option {
  display: block; width: 100%; padding: 12px 20px; border: none;
  border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer;
  text-align: center; text-decoration: none; transition: opacity 0.2s;
}
.dl-option:hover { opacity: 0.85; }
.dl-option.primary { background: #25f4ee; color: #000; }
.dl-option.secondary { background: #fe2c55; color: #fff; }
.dl-option.tertiary { background: #333; color: #fff; }
.error {
  display: none; padding: 16px 20px; background: #1a0000;
  border: 1px solid #fe2c55; border-radius: 12px; color: #fe2c55;
  font-size: 14px; margin-top: 12px;
}
.error.show { display: block; }
.loading { display: none; text-align: center; padding: 30px; color: #666; font-size: 14px; }
.loading.show { display: block; }
.spinner {
  display: inline-block; width: 24px; height: 24px; border: 2px solid #333;
  border-top-color: #fe2c55; border-radius: 50%; animation: spin 0.8s linear infinite;
  margin-right: 10px; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="container">
  <h1>抖音无水印下载</h1>
  <p class="subtitle">粘贴抖音分享链接，跳转在线工具下载</p>

  <div class="input-wrap">
    <input type="text" id="urlInput" placeholder="粘贴抖音分享链接到这里...">
    <button id="downloadBtn" onclick="doParse()">解析</button>
  </div>

  <div class="loading" id="loading">
    <span class="spinner"></span>解析中...
  </div>
  <div class="error" id="error"></div>

  <div class="result" id="result">
    <div class="info-card">
      <div class="desc" id="resultDesc"></div>
      <div class="dl-options" id="dlOptions"></div>
      <p style="color:#555;font-size:11px;margin-top:14px;text-align:center;">
        以下按钮将跳转到第三方在线下载网站
      </p>
    </div>
  </div>
</div>

<script>
async function doParse() {
  const input = document.getElementById('urlInput').value.trim();
  if (!input) return;

  const btn = document.getElementById('downloadBtn');
  const loading = document.getElementById('loading');
  const error = document.getElementById('error');
  const result = document.getElementById('result');

  result.classList.remove('show');
  error.classList.remove('show');
  loading.classList.add('show');
  btn.disabled = true;

  try {
    const resp = await fetch(`/api/parse?url=${encodeURIComponent(input)}`);
    const data = await resp.json();
    if (data.error) throw new Error(data.error);

    document.getElementById('resultDesc').textContent = data.desc || '';

    const container = document.getElementById('dlOptions');
    container.innerHTML = '';
    const colors = ['primary', 'secondary', 'tertiary'];
    (data.downloadOptions || []).forEach((opt, i) => {
      const a = document.createElement('a');
      a.className = 'dl-option ' + (colors[i] || 'tertiary');
      a.textContent = '在 ' + opt.name + ' 下载';
      a.href = opt.url;
      a.target = '_blank';
      a.rel = 'noopener';
      container.appendChild(a);
    });

    result.classList.add('show');
  } catch (e) {
    document.getElementById('error').textContent = '错误: ' + e.message;
    document.getElementById('error').classList.add('show');
  } finally {
    loading.classList.remove('show');
    btn.disabled = false;
  }
}

document.getElementById('urlInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doParse();
});

window.addEventListener('focus', async () => {
  try {
    const text = await navigator.clipboard.readText();
    if (text && (text.includes('douyin.com') || text.includes('v.douyin'))) {
      document.getElementById('urlInput').value = text;
    }
  } catch (e) {}
});
</script>
</body>
</html>
